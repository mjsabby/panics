    { path = "alloc::collections::vec_deque::VecDeque::drain", reason = "panics if the range is out of bounds or inverted; check it first" },
    { path = "alloc::collections::vec_deque::VecDeque::range", reason = "panics if the range is out of bounds or inverted; check it first" },
    { path = "alloc::collections::vec_deque::VecDeque::range_mut", reason = "panics if the range is out of bounds or inverted; check it first" },
    { path = "alloc::collections::vec_deque::VecDeque::split_off", reason = "panics if `at > len`; check it first" },
    { path = "alloc::collections::vec_deque::VecDeque::rotate_left", reason = "panics if the distance is greater than the length; check it first" },
    { path = "alloc::collections::vec_deque::VecDeque::rotate_right", reason = "panics if the distance is greater than the length; check it first" },
    { path = "alloc::collections::linked_list::LinkedList::split_off", reason = "panics if `at > len`; check it first" },
