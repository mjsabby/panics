    # ── Arithmetic ────────────────────────────────────────────────────────────────────────────
    # Operators are covered by the `arithmetic_side_effects` lint. It has holes, which nothing
    # here can close: shifts (`a << n`), the literals `-1` and `0` (`x / -1`, `x * -1`, `0 - x`),
    # and everything inside a `static` or `const` item. See the README.
    # "Overflow checks" are on in debug builds and wherever `overflow-checks = true`.
    { path = "core::ops::Add::add", reason = "operator called by name, which hides it from the operator lints; use a `checked_` method" },
    { path = "core::ops::Sub::sub", reason = "operator called by name, which hides it from the operator lints; use a `checked_` method" },
    { path = "core::ops::Mul::mul", reason = "operator called by name, which hides it from the operator lints; use a `checked_` method" },
