    { path = "alloc::vec::Vec::drain", reason = "panics if the range is out of bounds or inverted; check it first" },
    { path = "alloc::vec::Vec::splice", reason = "panics if the range is out of bounds or inverted; check it first" },
    { path = "alloc::vec::Vec::extend_from_within", reason = "panics if the range is out of bounds or inverted; check it first" },
    { path = "alloc::vec::Vec::extract_if", reason = "panics if the range is out of bounds or inverted; check it first" },
    { path = "alloc::vec::Vec::split_off", reason = "panics if `at > len`; check it first" },
    { path = "alloc::string::String::insert", reason = "panics if `idx` is past the end or not on a char boundary; check `is_char_boundary` first" },
    { path = "alloc::string::String::insert_str", reason = "panics if `idx` is past the end or not on a char boundary; check `is_char_boundary` first" },
    { path = "alloc::string::String::remove", reason = "panics if `idx` is not the start of a char; check `is_char_boundary` and `idx < len` first" },
    { path = "alloc::string::String::truncate", reason = "panics if `new_len` is not on a char boundary; check `is_char_boundary` first" },
    { path = "alloc::string::String::split_off", reason = "panics if `at` is past the end or not on a char boundary; check `is_char_boundary` first" },
    { path = "alloc::string::String::drain", reason = "panics if the range is out of bounds, inverted or not on char boundaries; check it first" },
    { path = "alloc::string::String::replace_range", reason = "panics if the range is out of bounds, inverted or not on char boundaries; check it first" },
    { path = "alloc::string::String::extend_from_within", reason = "panics if the range is out of bounds, inverted or not on char boundaries; check it first" },
