    { path = "std::collections::HashMap::get_disjoint_mut", reason = "panics if two of the keys are equal; make sure they are distinct first" },
    { path = "std::io::IoSlice::advance", reason = "panics if `n` is larger than what is left; check it first" },
    { path = "std::io::IoSlice::advance_slices", reason = "panics if `n` is larger than what is left; check it first" },
    { path = "std::io::IoSliceMut::advance", reason = "panics if `n` is larger than what is left; check it first" },
