# Ban list for code that must not panic.
#
# Every entry names a macro or function of the standard library that can panic, and says
# what to do instead. The entries are enforced by two clippy lints, which have to be switched
# on in Cargo.toml together with the three lints that cover operators (operators cannot be
# named here):
#
#     [lints.clippy]
#     disallowed_macros = "deny"
#     disallowed_methods = "deny"
#     indexing_slicing = "deny"
#     string_slice = "deny"
#     arithmetic_side_effects = "deny"
#
# Scope: everything in `core`, `alloc` and `std` whose documentation has a "Panics" section,
# as of Rust 1.100, plus the undocumented cases listed in docs/STD_PANICS.md. That file also
# lists what is deliberately left out and why. `tools/audit.py` re-checks the accounting
# against the installed toolchain, and `tools/verify.py` proves every entry with the probe crate.
#
# Paths name each item in the lowest crate where it is stable (`core::`, then `alloc::`, then
# `std::`), so the file also works in `no_std` crates: entries for crates that are not linked
# are ignored.
# Methods of primitive types are written `u32::pow`, `slice::swap`, `str::split_at`.

disallowed-macros = [

    # ── Explicit panics ───────────────────────────────────────────────────────────────────────
    { path = "core::panic", reason = "panics; return an error instead" },
    { path = "std::panic", reason = "panics; return an error instead" },
    { path = "core::unreachable", reason = "panics if reached; return an error, or restructure so the case cannot occur" },
    { path = "core::todo", reason = "panics; finish the code before committing it" },
    { path = "core::unimplemented", reason = "panics; return an error instead" },

    # ── Assertions ────────────────────────────────────────────────────────────────────────────
    { path = "core::assert", reason = "panics if the check fails; test the condition and return an error" },
    { path = "core::assert_eq", reason = "panics if the check fails; test the condition and return an error" },
    { path = "core::assert_ne", reason = "panics if the check fails; test the condition and return an error" },
    { path = "core::assert_matches", reason = "panics if the check fails; test the condition and return an error" },
    { path = "core::debug_assert", reason = "panics if the check fails in a build with debug assertions; test the condition and return an error" },
    { path = "core::debug_assert_eq", reason = "panics if the check fails in a build with debug assertions; test the condition and return an error" },
    { path = "core::debug_assert_ne", reason = "panics if the check fails in a build with debug assertions; test the condition and return an error" },
    { path = "core::debug_assert_matches", reason = "panics if the check fails in a build with debug assertions; test the condition and return an error" },

    # ── Printing ──────────────────────────────────────────────────────────────────────────────
    # These panic when the stream is closed or full, e.g. `tool | head`.
    { path = "std::print", reason = "panics if stdout is closed or full; use `write!` on `std::io::stdout()` and handle the error" },
    { path = "std::println", reason = "panics if stdout is closed or full; use `writeln!` on `std::io::stdout()` and handle the error" },
    { path = "std::eprint", reason = "panics if stderr is closed or full; use `write!` on `std::io::stderr()` and handle the error" },
    { path = "std::eprintln", reason = "panics if stderr is closed or full; use `writeln!` on `std::io::stderr()` and handle the error" },
    { path = "std::dbg", reason = "panics if stderr is closed or full; remove the debugging aid" },
]

disallowed-methods = [

    # ── Unwrapping ────────────────────────────────────────────────────────────────────────────
    { path = "core::option::Option::unwrap", reason = "panics on `None`; use `?`, a `match`, `ok_or` or `unwrap_or`" },
    { path = "core::option::Option::expect", reason = "panics on `None`; use `?`, a `match`, `ok_or` or `unwrap_or`" },
    { path = "core::result::Result::unwrap", reason = "panics on `Err`; use `?`, a `match` or `unwrap_or_else`" },
    { path = "core::result::Result::expect", reason = "panics on `Err`; use `?`, a `match` or `unwrap_or_else`" },
    { path = "core::result::Result::unwrap_err", reason = "panics on `Ok`; use a `match` or `err`" },
    { path = "core::result::Result::expect_err", reason = "panics on `Ok`; use a `match` or `err`" },

    # ── Explicit panics ───────────────────────────────────────────────────────────────────────
    { path = "std::panic::panic_any", reason = "panics; return an error instead" },
    { path = "std::panic::resume_unwind", reason = "continues a panic; return an error instead" },

    # ── Run-time borrow and initialization checks ─────────────────────────────────────────────
    { path = "core::cell::RefCell::borrow", reason = "panics if the value is mutably borrowed; use `try_borrow`" },
    { path = "core::cell::RefCell::borrow_mut", reason = "panics if the value is borrowed; use `try_borrow_mut`" },
    { path = "core::cell::RefCell::replace", reason = "panics if the value is borrowed; use `try_borrow_mut`" },
    { path = "core::cell::RefCell::replace_with", reason = "panics if the value is borrowed; use `try_borrow_mut`" },
    { path = "core::cell::RefCell::take", reason = "panics if the value is borrowed; use `try_borrow_mut`" },
    { path = "core::cell::RefCell::swap", reason = "panics if either value is borrowed; use `try_borrow_mut` on both" },
    { path = "core::cell::OnceCell::get_or_init", reason = "panics if the initializer re-enters the same cell; use `get` and `set`" },
    { path = "std::thread::LocalKey::with", reason = "panics if the thread-local is being or has been destroyed; use `try_with`" },
    { path = "std::thread::LocalKey::set", reason = "panics if the thread-local is being or has been destroyed, or (for a `RefCell`) is borrowed; use `try_with`" },
    { path = "std::thread::LocalKey::take", reason = "panics if the thread-local is being or has been destroyed, or (for a `RefCell`) is borrowed; use `try_with`" },
    { path = "std::thread::LocalKey::replace", reason = "panics if the thread-local is being or has been destroyed, or (for a `RefCell`) is borrowed; use `try_with`" },
    { path = "std::thread::LocalKey::with_borrow", reason = "panics if the value is mutably borrowed or the thread-local is destroyed; use `try_with` and `try_borrow`" },
    { path = "std::thread::LocalKey::with_borrow_mut", reason = "panics if the value is borrowed or the thread-local is destroyed; use `try_with` and `try_borrow_mut`" },

    # ── Indexes, ranges and lengths: slices and str ───────────────────────────────────────────
    # `container[index]` itself is covered by the `indexing_slicing` and `string_slice` lints.
    { path = "core::ops::Index::index", reason = "method form of `container[index]`, which panics on a missing index or key; use `get`" },
    { path = "core::ops::IndexMut::index_mut", reason = "method form of `container[index]`, which panics on a missing index or key; use `get_mut`" },
    { path = "slice::split_at", reason = "panics if `mid > len`; use `split_at_checked`" },
    { path = "slice::split_at_mut", reason = "panics if `mid > len`; use `split_at_mut_checked`" },
    { path = "slice::swap", reason = "panics if an index is out of bounds; check both indexes first" },
    { path = "slice::copy_from_slice", reason = "panics if the two slices differ in length; compare the lengths first" },
    { path = "slice::clone_from_slice", reason = "panics if the two slices differ in length; compare the lengths first" },
    { path = "slice::swap_with_slice", reason = "panics if the two slices differ in length; compare the lengths first" },
    { path = "slice::write_copy_of_slice", reason = "panics if the two slices differ in length; compare the lengths first" },
    { path = "slice::write_clone_of_slice", reason = "panics if the two slices differ in length; compare the lengths first" },
    { path = "slice::copy_within", reason = "panics if the source range or the destination is out of bounds; check them first" },
    { path = "slice::chunks", reason = "panics if `chunk_size` is 0; check it first, or use `as_chunks` for a constant size" },
    { path = "slice::chunks_mut", reason = "panics if `chunk_size` is 0; check it first, or use `as_chunks` for a constant size" },
    { path = "slice::chunks_exact", reason = "panics if `chunk_size` is 0; check it first, or use `as_chunks` for a constant size" },
    { path = "slice::chunks_exact_mut", reason = "panics if `chunk_size` is 0; check it first, or use `as_chunks` for a constant size" },
    { path = "slice::rchunks", reason = "panics if `chunk_size` is 0; check it first, or use `as_chunks` for a constant size" },
    { path = "slice::rchunks_mut", reason = "panics if `chunk_size` is 0; check it first, or use `as_chunks` for a constant size" },
    { path = "slice::rchunks_exact", reason = "panics if `chunk_size` is 0; check it first, or use `as_chunks` for a constant size" },
    { path = "slice::rchunks_exact_mut", reason = "panics if `chunk_size` is 0; check it first, or use `as_chunks` for a constant size" },
    { path = "slice::windows", reason = "panics if `size` is 0; check it first, or use `array_windows` for a constant size" },
    { path = "slice::rotate_left", reason = "panics if the distance is greater than the length; check it first" },
    { path = "slice::rotate_right", reason = "panics if the distance is greater than the length; check it first" },
    { path = "slice::select_nth_unstable", reason = "panics if `index >= len`; check it first" },
    { path = "slice::select_nth_unstable_by", reason = "panics if `index >= len`; check it first" },
    { path = "slice::select_nth_unstable_by_key", reason = "panics if `index >= len`; check it first" },
    { path = "core::iter::Iterator::step_by", reason = "panics if `step` is 0; check it first" },
    { path = "str::split_at", reason = "panics if `mid` is past the end or not on a char boundary; use `split_at_checked`" },
    { path = "str::split_at_mut", reason = "panics if `mid` is past the end or not on a char boundary; use `split_at_mut_checked`" },

    # ── Indexes, ranges and lengths: collections ──────────────────────────────────────────────
    { path = "alloc::vec::Vec::remove", reason = "panics if `index >= len`; check it first" },
